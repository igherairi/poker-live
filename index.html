  if(state.modal.type==='cashout'){
    const coGame = state.games.find(g=>g.id===state.modal.gameId);
    const coP = coGame.participants.find(p=>p.playerId===state.modal.playerId);
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Cash-out</h3>
          <label>Montant final des jetons (€)</label>
          <input id="cashout-amount" type="number" min="0" value="${coP.cashOut!==null && coP.cashOut!==undefined ? coP.cashOut : ''}" autofocus>
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-cashout">Valider</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='rake'){
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Ajouter du rake</h3>
          <p class="muted">Montant prélevé par la maison à l'instant T.</p>
          <label>Montant (€)</label>
          <input id="rake-amount" type="number" min="0" step="0.5" autofocus>
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-rake">Valider</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='tip'){
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Ajouter un pourboire</h3>
          <p class="muted">Pourboire reçu par un membre du staff pendant la session.</p>
          <label>Rôle</label>
          <select id="tip-role">
            <option>Croupier</option>
            <option>Serveuse</option>
            <option>Masseuse</option>
          </select>
          <label>Montant (€)</label>
          <input id="tip-amount" type="number" min="0" step="0.5" autofocus>
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-tip">Valider</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='add-staff'){
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Nouveau membre du staff</h3>
          <label>Nom</label>
          <input id="staff-name" placeholder="Ex : Karim" autofocus>
          <label>Rôle</label>
          <select id="staff-role">
            <option>Croupier</option>
            <option>Serveur</option>
            <option>Serveuse</option>
            <option>Masseuse</option>
            <option>Sécurité</option>
            <option>Autre</option>
          </select>
          <div class="field-row">
            <div><label>Téléphone (optionnel)</label><input id="staff-phone" placeholder="06…"></div>
          </div>
          <p class="muted">Le salaire n'est plus fixé par un taux horaire : tu le renseignes librement à la fin de chaque partie.</p>
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-add-staff">Ajouter</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='assign-staff'){
    const activeStaff = state.staff.filter(s=>s.active);
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Assigner du staff</h3>
          ${activeStaff.length ? `
            <label>Membre</label>
            <select id="assign-staff-select">
              ${activeStaff.map(s=>`<option value="${s.id}">${escapeHtml(s.name)} — ${escapeHtml(s.role)}</option>`).join('')}
            </select>
            <label>Heures travaillées (optionnel, informatif)</label>
            <input id="assign-staff-hours" type="number" min="0" step="0.5" placeholder="Ex : 5">
            <p class="muted">Tu pourras renseigner son salaire et ses pourboires à la fin de la partie, une fois son temps de travail connu.</p>
            <div class="modal-actions">
              <button class="btn secondary" id="modal-cancel">Annuler</button>
              <button class="btn" id="modal-confirm-assign-staff">Assigner</button>
            </div>
          ` : `<p class="muted">Aucun membre actif. Ajoute d'abord du staff dans Admin → Staff.</p><div class="modal-actions"><button class="btn secondary block" id="modal-cancel">Fermer</button></div>`}
        </div>
      </div>
    `;
  }
  if(state.modal.type==='edit-staff-assignment'){
    const eGame = state.games.find(g=>g.id===state.modal.gameId);
    const eAssign = eGame.staffAssignments.find(a=>a.id===state.modal.assignmentId);
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Rémunération — ${escapeHtml(eAssign.name)}</h3>
          <p class="muted">${escapeHtml(eAssign.role)}${eAssign.hours ? ` · ${eAssign.hours}h travaillées` : ''}</p>
          <label>Salaire (€)</label>
          <input id="edit-sa-salary" type="number" min="0" step="0.5" value="${eAssign.salary!==null && eAssign.salary!==undefined ? eAssign.salary : ''}" placeholder="Ex : 100" autofocus>
          <label>Pourboires (€)</label>
          <input id="edit-sa-tips" type="number" min="0" step="0.5" value="${eAssign.tips||0}">
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-edit-staff-assignment">Enregistrer</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='add-expense'){
    const presets = ['Repas','Boissons','Desserts','Loyer / Salle','Jeux de cartes','Sécurité','Matériel','Ménage'];
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Ajouter un frais annexe</h3>
          <label>Catégories rapides</label>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${presets.map(c=>`<button type="button" class="btn small secondary" data-expense-preset="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
          </div>
          <label>Libellé</label>
          <input id="expense-label" placeholder="Ex : Repas, boissons, salle…" autofocus>
          <label>Montant (€)</label>
          <input id="expense-amount" type="number" min="0" step="0.5">
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-add-expense">Ajouter</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='confirm-delete-game'){
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Supprimer la partie ?</h3>
          <p class="muted">Cette action est définitive et effacera tout l'historique de cette partie.</p>
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn danger" id="modal-confirm-delete-game">Supprimer</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='edit-game'){
    const eg = state.games.find(g=>g.id===state.modal.gameId);
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Modifier la partie</h3>
          <label>Nom de la partie</label>
          <input id="eg-name" value="${escapeHtml(eg.name)}">
          <div class="field-row">
            <div><label>Date</label><input id="eg-date" type="date" value="${eg.date||''}"></div>
            <div><label>Heure</label><input id="eg-time" type="time" value="${eg.time||''}"></div>
          </div>
          <label>Lieu</label>
          <input id="eg-location" value="${escapeHtml(eg.location||'')}">
          <div class="field-row">
            <div><label>Mode</label>
              <select id="eg-mode">
                <option value="Live" ${eg.mode!=='ClubGG'?'selected':''}>Live (présentiel)</option>
                <option value="ClubGG" ${eg.mode==='ClubGG'?'selected':''}>En ligne (ClubGG)</option>
              </select>
            </div>
            <div><label>ID table ClubGG</label><input id="eg-clubgg" value="${escapeHtml(eg.clubggTable||'')}"></div>
          </div>
          <div class="field-row">
            <div><label>Format</label>
              <select id="eg-format">
                <option ${eg.format==='Cash Game'?'selected':''}>Cash Game</option>
                <option ${eg.format==='Tournoi'?'selected':''}>Tournoi</option>
              </select>
            </div>
            <div><label>Variante</label>
              <select id="eg-variant">
                <option ${eg.variant==='NLH'?'selected':''}>NLH</option>
                <option ${eg.variant==='PLO'?'selected':''}>PLO</option>
                <option ${eg.variant==='Mixed'?'selected':''}>Mixed</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div><label>Buy-in (€)</label><input id="eg-buyin" type="number" min="0" value="${eg.buyIn}"></div>
            <div><label>Places max</label><input id="eg-max" type="number" min="2" value="${eg.maxPlayers}"></div>
          </div>
          <div class="field-row">
            <div><label>Recaves max/joueur</label><input id="eg-max-buyins" type="number" min="1" value="${eg.maxBuyIns||''}" placeholder="Illimité"></div>
            <div><label>Montant max/recave (€)</label><input id="eg-max-buyin-amount" type="number" min="0" value="${eg.maxBuyInAmount||''}" placeholder="Illimité"></div>
          </div>
          <label>Blinds</label>
          <input id="eg-blinds" value="${escapeHtml(eg.blinds||'')}" placeholder="Ex : 1/2, 2/5, ou structure tournoi">
          <label>Services disponibles</label>
          <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px">
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);margin:0"><input type="checkbox" id="eg-amenity-croupier" style="width:auto" ${eg.hasCroupier?'checked':''}>🎩 Croupier</label>
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);margin:0"><input type="checkbox" id="eg-amenity-serveuse" style="width:auto" ${eg.hasServeuse?'checked':''}>🍸 Serveuse</label>
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);margin:0"><input type="checkbox" id="eg-amenity-masseuse" style="width:auto" ${eg.hasMasseuse?'checked':''}>💆 Masseuse</label>
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);margin:0"><input type="checkbox" id="eg-amenity-voiturier" style="width:auto" ${eg.hasVoiturier?'checked':''}>🚗 Voiturier</label>
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);margin:0"><input type="checkbox" id="eg-amenity-repas" style="width:auto" ${eg.hasRepasBoissons?'checked':''}>🍽️ Repas &amp; boissons offerts</label>
          </div>
          <label>Notes</label>
          <textarea id="eg-notes" rows="2">${escapeHtml(eg.notes||'')}</textarea>
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-edit-game">Enregistrer</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='admin-add-player'){
    const gGame = state.games.find(g=>g.id===state.modal.gameId);
    const available = state.players.filter(pl=>!gGame.participants.some(p=>p.playerId===pl.id));
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Ajouter un joueur</h3>
          ${available.length ? `
            <label>Joueur</label>
            <select id="aap-player-select">
              ${available.map(pl=>`<option value="${pl.id}">${escapeHtml(pl.pseudo)}</option>`).join('')}
            </select>
            ${gGame.status==='live' ? `
              <label>Moyen de paiement (buy-in initial ${fmt(gGame.buyIn)} €)</label>
              <select id="aap-method">
                ${PAYMENT_METHODS.map(m=>`<option value="${m}">${m}</option>`).join('')}
              </select>
            ` : ''}
            <div class="modal-actions">
              <button class="btn secondary" id="modal-cancel">Annuler</button>
              <button class="btn" id="modal-confirm-admin-add-player">Ajouter</button>
            </div>
          ` : `<p class="muted">Tous les joueurs sont déjà dans cette partie, ou aucun compte n'existe encore.</p><div class="modal-actions"><button class="btn secondary block" id="modal-cancel">Fermer</button></div>`}
        </div>
      </div>
    `;
  }
  if(state.modal.type==='admin-create-player'){
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Créer un joueur</h3>
          <p class="muted">Crée le compte, puis partage-lui son pseudo et son code.</p>
          <label>Pseudo</label>
          <input id="acp-pseudo" placeholder="Ex : Ben" autofocus>
          <label>Code PIN (4 chiffres)</label>
          <div class="field-row">
            <div><input id="acp-pin" maxlength="4" inputmode="numeric" value="${randomPin()}"></div>
            <div style="flex:0 0 auto"><button class="btn secondary" id="btn-generate-pin" type="button">🎲 Générer</button></div>
          </div>
          <label>Téléphone (optionnel)</label>
          <input id="acp-phone" placeholder="06…">
          <label>Pseudo ClubGG (optionnel)</label>
          <input id="acp-clubgg" placeholder="Ex : ClubGG_Ben">
          <label>Moyen de paiement</label>
          <select id="acp-payment">
            ${PAYMENT_METHODS.map(m=>`<option value="${m}">${m}</option>`).join('')}
          </select>
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-admin-create-player">Créer le joueur</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='edit-player-profile'){
    const p = state.players.find(p=>p.id===state.modal.playerId);
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Profil — ${escapeHtml(p.pseudo)}</h3>
          <label>Pseudo ClubGG</label>
          <input id="epp-clubgg" value="${escapeHtml(p.clubggUsername||'')}" placeholder="Ex : ClubGG_Ben">
          <label>Commentaire admin (privé, visible admins uniquement)</label>
          <textarea id="epp-notes" rows="3" placeholder="Notes internes sur ce joueur…">${escapeHtml(p.adminNotes||'')}</textarea>
          <button class="btn secondary block" id="btn-save-player-profile" style="margin-top:8px">Enregistrer</button>

          <hr class="gold">
          <label>Autres sites de poker</label>
          ${(p.pokerAccounts||[]).length ? p.pokerAccounts.map(a=>`
            <div class="list-row"><span><strong>${escapeHtml(a.site)}</strong> — ${escapeHtml(a.username)}</span><button class="btn small danger" data-remove-poker-account="${p.id}|${a.id}">✕</button></div>
          `).join('') : '<div class="muted">Aucun autre compte renseigné.</div>'}
          <div class="field-row" style="margin-top:8px">
            <div><input id="epp-site" placeholder="Site (ex : PokerStars, Winamax…)"></div>
            <div><input id="epp-username" placeholder="Pseudo sur ce site"></div>
          </div>
          <button class="btn small secondary block" id="btn-add-poker-account" style="margin-top:8px">+ Ajouter ce compte</button>

          <div class="modal-actions">
            <button class="btn secondary block" id="modal-cancel">Fermer</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='share-credentials'){
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Identifiants du joueur</h3>
          <p class="muted">Copie ce message et envoie-le par SMS, WhatsApp ou Snapchat.</p>
          <textarea id="share-creds-text" rows="6" readonly style="font-family:'Barlow Condensed',sans-serif">${escapeHtml(state.modal.text)}</textarea>
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Fermer</button>
            <button class="btn" id="btn-copy-creds">📋 Copier</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='poster'){
    const g = state.games.find(g=>g.id===state.modal.gameId);
    if(!g) return '';
    const dateStr = g.date ? new Date(g.date+'T'+(g.time||'00:00')).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}) : 'Date à confirmer';
    const spotsLeft = g.maxPlayers - g.participants.length;
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Affiche de la partie</h3>
          <p class="muted">Télécharge et partage cette affiche pour annoncer la partie.</p>
          <div class="poster-outer">
            <div class="poster-card" id="poster-render-target">
              <div>
                <div class="p-brand">POKER LIVE</div>
                <div class="p-eyebrow">${escapeHtml(g.format||'Cash Game')} · ${escapeHtml(g.variant||'NLH')}</div>
                <div class="p-name">${escapeHtml(g.name)}</div>
                <div class="p-badges">
                  <span class="badge gold">${escapeHtml(g.variant||'NLH')}</span>
                  ${spotsLeft>0 ? `<span class="badge green">${spotsLeft} place(s)</span>` : `<span class="badge live">Complet</span>`}
                </div>
                <div class="p-date">${dateStr}${g.time?' · '+escapeHtml(g.time):''}</div>
                <div class="p-loc">${escapeHtml(g.location||'Lieu communiqué aux inscrits')}</div>
                ${g.blinds ? `<div class="p-loc">Blinds : ${escapeHtml(g.blinds)}</div>` : ''}
              </div>
              <div>
                <div class="p-buyin-box">
                  <div class="amt">${fmt(g.buyIn)} €</div>
                  <div class="lbl">Buy-in</div>
                </div>
                <div class="p-spots">${g.maxPlayers} places au total</div>
                ${(g.hasCroupier||g.hasServeuse||g.hasMasseuse||g.hasVoiturier||g.hasRepasBoissons) ? `<div class="p-spots">${[g.hasCroupier&&'🎩',g.hasServeuse&&'🍸',g.hasMasseuse&&'💆',g.hasVoiturier&&'🚗',g.hasRepasBoissons&&'🍽️'].filter(Boolean).join(' ')}</div>` : ''}
                <div class="p-cta">Connecte-toi sur l'appli pour t'inscrire</div>
                <div class="p-footer">Strictement Privé · Poker Live</div>
              </div>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Fermer</button>
            <button class="btn" id="btn-download-poster">⬇️ Télécharger l'affiche</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='invite'){
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Inviter les joueurs</h3>
          <p class="muted">Copie ce message et envoie-le par SMS, WhatsApp, Snapchat ou dans le groupe.</p>
          <textarea id="invite-text" rows="7" readonly style="font-family:'Barlow Condensed',sans-serif">${escapeHtml(state.modal.text)}</textarea>
          ${!state.appUrl ? `<p class="muted" style="margin-top:8px">💡 Configure le lien de l'appli dans Admin → Vue d'ensemble pour inclure un vrai lien cliquable.</p>` : ''}
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Fermer</button>
            <button class="btn" id="btn-copy-invite">📋 Copier</button>
          </div>
        </div>
      </div>
    `;
  }
  return '';
}

/* ---------- Event wiring ---------- */
function attachAppEvents(){
  const logoutBtn = document.getElementById('btn-logout'); if(logoutBtn) logoutBtn.onclick = logout;
  const notifBtn = document.getElementById('btn-toggle-notifs'); if(notifBtn) notifBtn.onclick = toggleNotifications;
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>setView(el.getAttribute('data-nav')));
  document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>setGameFilter(el.getAttribute('data-filter')));
  const gameSearchInput = document.getElementById('game-search-input');
  if(gameSearchInput){ gameSearchInput.oninput = ()=>{ state.gameSearchQuery = gameSearchInput.value; render(); const el=document.getElementById('game-search-input'); if(el){ el.focus(); el.setSelectionRange(state.gameSearchQuery.length, state.gameSearchQuery.length); } }; }
  const btnToggleCalendar = document.getElementById('btn-toggle-calendar'); if(btnToggleCalendar) btnToggleCalendar.onclick = ()=>{ state.gamesViewMode = state.gamesViewMode==='calendar'?'list':'calendar'; render(); };
  const btnCalPrev = document.getElementById('btn-cal-prev'); if(btnCalPrev) btnCalPrev.onclick = ()=>{ shiftCalendarMonth(-1); };
  const btnCalNext = document.getElementById('btn-cal-next'); if(btnCalNext) btnCalNext.onclick = ()=>{ shiftCalendarMonth(1); };
  document.querySelectorAll('[data-calendar-day]').forEach(el=>el.onclick=()=>{ state.calendarSelectedDate = el.getAttribute('data-calendar-day'); render(); });
  document.querySelectorAll('[data-open-game]').forEach(el=>el.onclick=()=>openGame(el.getAttribute('data-open-game')));
  document.querySelectorAll('[data-view-poster]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openPosterModal(el.getAttribute('data-view-poster')); });
  document.querySelectorAll('[data-view-invite]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openInviteModal(el.getAttribute('data-view-invite')); });
  document.querySelectorAll('[data-edit-game]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openEditGameModal(el.getAttribute('data-edit-game')); });
  const btnSaveAppUrl = document.getElementById('btn-save-app-url'); if(btnSaveAppUrl) btnSaveAppUrl.onclick = saveAppUrl;
  const btnExportJson = document.getElementById('btn-export-json'); if(btnExportJson) btnExportJson.onclick = exportAllDataJson;
  const btnExportCsv = document.getElementById('btn-export-csv'); if(btnExportCsv) btnExportCsv.onclick = exportAccountingCsv;
  const btnCopyInvite = document.getElementById('btn-copy-invite'); if(btnCopyInvite) btnCopyInvite.onclick = ()=>copyTextareaById('invite-text');
  const backGames = document.getElementById('btn-back-games'); if(backGames) backGames.onclick = ()=>setView('games');
  const createBtn = document.getElementById('btn-create-game'); if(createBtn) createBtn.onclick = openCreateGameModal;
  const createBtnDash = document.getElementById('btn-create-game-dash'); if(createBtnDash) createBtnDash.onclick = openCreateGameModal;

  document.querySelectorAll('[data-join]').forEach(el=>el.onclick=()=>joinGame(el.getAttribute('data-join')));
  document.querySelectorAll('[data-leave]').forEach(el=>el.onclick=()=>leaveGame(el.getAttribute('data-leave')));
  document.querySelectorAll('[data-start]').forEach(el=>el.onclick=()=>startGame(el.getAttribute('data-start')));
  document.querySelectorAll('[data-add-player]').forEach(el=>el.onclick=()=>openAdminAddPlayerModal(el.getAttribute('data-add-player')));
  document.querySelectorAll('[data-add-all-players]').forEach(el=>el.onclick=()=>addAllPlayersToGame(el.getAttribute('data-add-all-players')));
  document.querySelectorAll('[data-remove-participant]').forEach(el=>el.onclick=()=>{
    const [gameId, playerId] = el.getAttribute('data-remove-participant').split('|');
    removeParticipantAdmin(gameId, playerId);
  });
  document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>closeGame(el.getAttribute('data-close')));
  document.querySelectorAll('[data-buyin]').forEach(el=>el.onclick=()=>{
    const [gameId, playerId] = el.getAttribute('data-buyin').split('|');
    openAddBuyinModal(gameId, playerId);
  });
  document.querySelectorAll('[data-cashout]').forEach(el=>el.onclick=()=>{
    const [gameId, playerId] = el.getAttribute('data-cashout').split('|');
    openCashoutModal(gameId, playerId);
  });
  document.querySelectorAll('[data-request-buyin]').forEach(el=>el.onclick=()=>openRequestBuyinModal(el.getAttribute('data-request-buyin')));
  document.querySelectorAll('[data-edit-buyin]').forEach(el=>el.onclick=()=>{
    const [gameId, playerId, index] = el.getAttribute('data-edit-buyin').split('|');
    openEditBuyinModal(gameId, playerId, parseInt(index));
  });
  document.querySelectorAll('[data-remove-buyin]').forEach(el=>el.onclick=()=>{
    const [gameId, playerId, index] = el.getAttribute('data-remove-buyin').split('|');
    removeBuyin(gameId, playerId, parseInt(index));
  });
  document.querySelectorAll('[data-edit-arrival]').forEach(el=>el.onclick=()=>{
    const [gameId, playerId] = el.getAttribute('data-edit-arrival').split('|');
    openEditArrivalModal(gameId, playerId);
  });
  document.querySelectorAll('[data-confirm-request]').forEach(el=>el.onclick=()=>{
    const [gameId, playerId, requestId] = el.getAttribute('data-confirm-request').split('|');
    confirmBuyinRequest(gameId, playerId, requestId);
  });
  document.querySelectorAll('[data-refuse-request]').forEach(el=>el.onclick=()=>{
    const [gameId, playerId, requestId] = el.getAttribute('data-refuse-request').split('|');
    refuseBuyinRequest(gameId, playerId, requestId);
  });

  // Admin nav & sub-tabs
  document.querySelectorAll('[data-admin-tab]').forEach(el=>el.onclick=()=>{ state.adminTab = el.getAttribute('data-admin-tab'); render(); });

  // Messages
  document.querySelectorAll('[data-messages-tab]').forEach(el=>el.onclick=()=>setMessagesTab(el.getAttribute('data-messages-tab')));
  const btnSendCommunity = document.getElementById('btn-send-community'); if(btnSendCommunity) btnSendCommunity.onclick = sendCommunityMessage;
  const communityInput = document.getElementById('community-input'); if(communityInput) communityInput.onkeydown = (e)=>{ if(e.key==='Enter') sendCommunityMessage(); };
  const btnSendDm = document.getElementById('btn-send-dm'); if(btnSendDm) btnSendDm.onclick = sendDmMessage;
  const dmInput = document.getElementById('dm-input'); if(dmInput) dmInput.onkeydown = (e)=>{ if(e.key==='Enter') sendDmMessage(); };
  document.querySelectorAll('[data-open-dm-thread]').forEach(el=>el.onclick=()=>openDmThread(el.getAttribute('data-open-dm-thread')));
  const btnBackDmList = document.getElementById('btn-back-dm-list'); if(btnBackDmList) btnBackDmList.onclick = ()=>{ state.activeDmPlayerId = null; render(); };

  // Rake
  document.querySelectorAll('[data-add-rake]').forEach(el=>el.onclick=()=>openAddRakeModal(el.getAttribute('data-add-rake')));
  document.querySelectorAll('[data-remove-rake]').forEach(el=>el.onclick=()=>{
    const [gameId, entryId] = el.getAttribute('data-remove-rake').split('|');
    removeRakeEntry(gameId, entryId);
  });
  document.querySelectorAll('[data-add-tip]').forEach(el=>el.onclick=()=>openAddTipModal(el.getAttribute('data-add-tip')));
  document.querySelectorAll('[data-remove-tip]').forEach(el=>el.onclick=()=>{
    const [gameId, entryId] = el.getAttribute('data-remove-tip').split('|');
    removeTipEntry(gameId, entryId);
  });

  // Staff (global)
  const btnAddStaff = document.getElementById('btn-add-staff'); if(btnAddStaff) btnAddStaff.onclick = openAddStaffModal;
  document.querySelectorAll('[data-toggle-staff]').forEach(el=>el.onclick=()=>toggleStaffActive(el.getAttribute('data-toggle-staff')));
  document.querySelectorAll('[data-delete-staff]').forEach(el=>el.onclick=()=>deleteStaff(el.getAttribute('data-delete-staff')));

  // Staff assignment (per game)
  document.querySelectorAll('[data-assign-staff]').forEach(el=>el.onclick=()=>openAssignStaffModal(el.getAttribute('data-assign-staff')));
  document.querySelectorAll('[data-remove-staff-assign]').forEach(el=>el.onclick=()=>{
    const [gameId, assignmentId] = el.getAttribute('data-remove-staff-assign').split('|');
    removeStaffAssignment(gameId, assignmentId);
  });
  document.querySelectorAll('[data-edit-staff-assign]').forEach(el=>el.onclick=()=>{
    const [gameId, assignmentId] = el.getAttribute('data-edit-staff-assign').split('|');
    openEditStaffAssignmentModal(gameId, assignmentId);
  });

  // Expenses
  document.querySelectorAll('[data-add-expense]').forEach(el=>el.onclick=()=>openAddExpenseModal(el.getAttribute('data-add-expense')));
  document.querySelectorAll('[data-expense-preset]').forEach(el=>el.onclick=()=>{ document.getElementById('expense-label').value = el.getAttribute('data-expense-preset'); });
  document.querySelectorAll('[data-remove-expense]').forEach(el=>el.onclick=()=>{
    const [gameId, expenseId] = el.getAttribute('data-remove-expense').split('|');
    removeExpense(gameId, expenseId);
  });

  // Players admin
  document.querySelectorAll('[data-toggle-admin]').forEach(el=>el.onclick=()=>toggleAdmin(el.getAttribute('data-toggle-admin')));
  document.querySelectorAll('[data-reset-pin]').forEach(el=>el.onclick=()=>resetPin(el.getAttribute('data-reset-pin')));
  document.querySelectorAll('[data-delete-player]').forEach(el=>el.onclick=()=>deletePlayerAdmin(el.getAttribute('data-delete-player')));
  document.querySelectorAll('[data-share-creds]').forEach(el=>el.onclick=()=>openShareCredentialsModal(el.getAttribute('data-share-creds')));
  document.querySelectorAll('[data-view-player-analytics]').forEach(el=>el.onclick=()=>openPlayerAnalytics(el.getAttribute('data-view-player-analytics')));
  document.querySelectorAll('[data-edit-player-profile]').forEach(el=>el.onclick=()=>openEditPlayerProfileModal(el.getAttribute('data-edit-player-profile')));
  const btnSavePlayerProfile = document.getElementById('btn-save-player-profile'); if(btnSavePlayerProfile) btnSavePlayerProfile.onclick = submitPlayerProfileBasics;
  const btnAddPokerAccount = document.getElementById('btn-add-poker-account'); if(btnAddPokerAccount) btnAddPokerAccount.onclick = addPokerAccount;
  document.querySelectorAll('[data-remove-poker-account]').forEach(el=>el.onclick=()=>{
    const [playerId, accountId] = el.getAttribute('data-remove-poker-account').split('|');
    removePokerAccount(playerId, accountId);
  });
  const btnBackAdminPlayers = document.getElementById('btn-back-admin-players'); if(btnBackAdminPlayers) btnBackAdminPlayers.onclick = ()=>{ state.view='admin'; state.adminTab='players'; render(); };
  const btnAdminCreatePlayer = document.getElementById('btn-admin-create-player'); if(btnAdminCreatePlayer) btnAdminCreatePlayer.onclick = openAdminCreatePlayerModal;
  const btnGeneratePin = document.getElementById('btn-generate-pin'); if(btnGeneratePin) btnGeneratePin.onclick = ()=>{ document.getElementById('acp-pin').value = randomPin(); };
  const btnCopyCreds = document.getElementById('btn-copy-creds'); if(btnCopyCreds) btnCopyCreds.onclick = copyCredentials;

  // Games admin (delete)
  document.querySelectorAll('[data-delete-game]').forEach(el=>el.onclick=()=>deleteGameAdmin(el.getAttribute('data-delete-game')));
  document.querySelectorAll('[data-delete-game-list]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); deleteGameAdmin(el.getAttribute('data-delete-game-list')); });

  const overlay = document.getElementById('modal-overlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==='modal-overlay') closeModal(); };
  const modalCancel = document.getElementById('modal-cancel'); if(modalCancel) modalCancel.onclick = closeModal;
  const btnDownloadPoster = document.getElementById('btn-download-poster'); if(btnDownloadPoster) btnDownloadPoster.onclick = downloadPoster;
  const confirmCreate = document.getElementById('modal-confirm-create'); if(confirmCreate) confirmCreate.onclick = submitCreateGame;
  const confirmEditGame = document.getElementById('modal-confirm-edit-game'); if(confirmEditGame) confirmEditGame.onclick = submitEditGame;
  const confirmBuyin = document.getElementById('modal-confirm-buyin'); if(confirmBuyin) confirmBuyin.onclick = submitBuyin;
  const confirmRequestBuyin = document.getElementById('modal-confirm-request-buyin'); if(confirmRequestBuyin) confirmRequestBuyin.onclick = submitRequestBuyin;
  const confirmEditBuyin = document.getElementById('modal-confirm-edit-buyin'); if(confirmEditBuyin) confirmEditBuyin.onclick = submitEditBuyin;
  const confirmEditArrival = document.getElementById('modal-confirm-edit-arrival'); if(confirmEditArrival) confirmEditArrival.onclick = submitEditArrival;
  const confirmCashout = document.getElementById('modal-confirm-cashout'); if(confirmCashout) confirmCashout.onclick = submitCashout;
  const confirmRake = document.getElementById('modal-confirm-rake'); if(confirmRake) confirmRake.onclick = submitRake;
  const confirmTip = document.getElementById('modal-confirm-tip'); if(confirmTip) confirmTip.onclick = submitTip;
  const confirmAddStaff = document.getElementById('modal-confirm-add-staff'); if(confirmAddStaff) confirmAddStaff.onclick = submitAddStaff;
  const confirmAssignStaff = document.getElementById('modal-confirm-assign-staff'); if(confirmAssignStaff) confirmAssignStaff.onclick = submitAssignStaff;
  const confirmEditStaffAssign = document.getElementById('modal-confirm-edit-staff-assignment'); if(confirmEditStaffAssign) confirmEditStaffAssign.onclick = submitEditStaffAssignment;
  const confirmAddExpense = document.getElementById('modal-confirm-add-expense'); if(confirmAddExpense) confirmAddExpense.onclick = submitAddExpense;
  const confirmDeleteGameBtn = document.getElementById('modal-confirm-delete-game'); if(confirmDeleteGameBtn) confirmDeleteGameBtn.onclick = confirmDeleteGame;
  document.querySelectorAll('[data-payment-method]').forEach(el=>el.onchange=()=>updatePlayerPayment(el.getAttribute('data-payment-method'), el.value));
  document.querySelectorAll('[data-player-status]').forEach(el=>el.onchange=()=>updatePlayerStatus(el.getAttribute('data-player-status'), el.value));
  const playerSearchInput = document.getElementById('player-search-input');
  if(playerSearchInput){ playerSearchInput.oninput = ()=>{ state.playerSearchQuery = playerSearchInput.value; render(); const el=document.getElementById('player-search-input'); if(el){ el.focus(); el.setSelectionRange(state.playerSearchQuery.length, state.playerSearchQuery.length); } }; }

  const confirmAdminCreatePlayer = document.getElementById('modal-confirm-admin-create-player'); if(confirmAdminCreatePlayer) confirmAdminCreatePlayer.onclick = submitAdminCreatePlayer;
  const confirmAdminAddPlayer = document.getElementById('modal-confirm-admin-add-player'); if(confirmAdminAddPlayer) confirmAdminAddPlayer.onclick = submitAdminAddPlayer;
  initPageCharts();
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

init();
</script>

</html>
