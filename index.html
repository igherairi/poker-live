<style>
  :root{
    --bg:#12293f;
    --bg-card:#1a3a56;
    --bg-card-alt:#224863;
    --bg-input:#0f2337;
    --gold:#3ea6ff;
    --gold-light:#2dd4a0;
    --text:#f1f7fb;
    --text-muted:#a9c3d6;
    --border:#2e5375;
    --green:#2dd4a0;
    --red:#ff7a7a;
    --on-accent:#0b1e30;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Barlow Condensed',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:1px;
    font-weight:400;
  }
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:2.5px;
    font-size:11px;
    color:var(--gold);
    font-weight:600;
  }
  #app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  /* Header */
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;background:rgba(18,41,63,0.95);backdrop-filter:blur(6px);z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;line-height:1;}
  .brand .wordmark{line-height:1;}
  .brand .wordmark{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold-light);letter-spacing:2px;}
  .brand .tagline{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-top:2px;}
  .user-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-card-alt);border:1px solid var(--border);
    border-radius:20px;padding:6px 12px 6px 6px;font-size:14px;
  }
  .avatar{
    width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-light));
    display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:700;font-size:11px;font-family:'Barlow Condensed',sans-serif;
  }
  .logout-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;text-decoration:underline;font-family:'Barlow Condensed',sans-serif;}
  /* Nav */
  nav.tabs{
    display:flex;border-bottom:1px solid var(--border);
    position:sticky;top:64px;background:var(--bg);z-index:19;
    overflow-x:auto;
  }
  nav.tabs button{
    flex:1;background:none;border:none;color:var(--text-muted);
    padding:12px 8px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;
    text-transform:uppercase;letter-spacing:1px;cursor:pointer;border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{color:var(--gold-light);border-bottom-color:var(--gold);}
  main{flex:1;padding:20px;padding-bottom:60px;}
  /* Cards */
  .card{
    background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--gold);
    border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;
    box-shadow:0 4px 18px rgba(3,10,20,0.35);transition:transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card.flat{border-left:3px solid var(--border);}
  .card[data-open-game]:hover, .card[data-calendar-day]:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(3,10,20,0.5);border-left-color:var(--gold-light);}
  .card-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--text);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .muted{color:var(--text-muted);font-size:13px;}
  .badge{
    display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;
  }
  .badge.gold{background:rgba(62,166,255,0.15);color:var(--gold);border:1px solid rgba(62,166,255,0.4);}
  .badge.live{background:rgba(255,122,122,0.15);color:var(--red);border:1px solid rgba(255,122,122,0.4);}
  .badge.done{background:rgba(169,195,214,0.12);color:var(--text-muted);border:1px solid var(--border);}
  .badge.green{background:rgba(45,212,160,0.15);color:var(--green);border:1px solid rgba(45,212,160,0.4);}
  hr.gold{border:none;border-top:1px solid rgba(62,166,255,0.35);margin:12px 0;}
  /* Buttons */
  .btn{
    background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--on-accent);border:none;
    padding:10px 18px;border-radius:7px;font-family:'Barlow Condensed',sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:1px;font-size:13px;cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }
  .btn:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 4px 14px rgba(62,166,255,0.35);}
  .btn:active:not(:disabled){transform:scale(0.97);}
  .btn.secondary:hover:not(:disabled){background:var(--bg-card-alt);border-color:var(--gold);}
  .player-chip:hover, .subtabs button:hover, nav.tabs button:hover{color:var(--gold-light);}
  .btn.secondary{background:none;border:1px solid var(--border);color:var(--text);}
  .btn.danger{background:none;border:1px solid var(--red);color:var(--red);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn.small{padding:6px 12px;font-size:11px;}
  .btn.block{width:100%;}
  /* Forms */
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:5px;margin-top:12px;}
  input,select,textarea{
    width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:7px;font-family:'Barlow Condensed',sans-serif;font-size:15px;
  }
  input:focus,select:focus,textarea:focus{outline:1px solid var(--gold);border-color:var(--gold);}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;}
  /* Login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{max-width:380px;width:100%;text-align:center;}
  .login-card .wordmark{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--gold-light);letter-spacing:3px;}
  .login-card .tagline{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--text-muted);margin-bottom:24px;}
  .pin-dots{display:flex;gap:10px;justify-content:center;margin:14px 0;}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--gold);}
  .pin-dot.filled{background:var(--gold-light);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:16px auto 0;}
  .keypad button{
    aspect-ratio:1;border-radius:10px;background:var(--bg-card-alt);border:1px solid var(--border);
    color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:22px;cursor:pointer;
  }
  .keypad button:active{background:var(--border);}
  .player-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .player-chip{
    background:var(--bg-card-alt);border:1px solid var(--border);padding:8px 14px;border-radius:20px;
    cursor:pointer;font-size:14px;
  }
  .player-chip:hover{border-color:var(--gold);}
  /* Stat grid */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
  .stat-box{background:var(--bg-card-alt);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;}
  .stat-box .num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold-light);}
  .stat-box .lbl{font-size:10px;text-transform:uppercase;color:var(--text-muted);letter-spacing:1px;}
  /* Welcome hero */
  .welcome-hero{
    position:relative;overflow:hidden;background:linear-gradient(155deg,var(--bg-card-alt) 0%,var(--bg-card) 65%);
    border:1px solid var(--border);border-radius:16px;padding:20px 20px 18px;margin-bottom:18px;
    box-shadow:0 8px 26px rgba(3,10,20,0.4);
  }
  .welcome-hero::before{
    content:'';position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(62,166,255,0.22),transparent 70%);pointer-events:none;
  }
  .welcome-hero .eyebrow{position:relative}
  .welcome-hero .card-title{position:relative;font-size:26px;margin-top:2px}
  /* Live hero game card */
  .hero-game{
    position:relative;overflow:hidden;cursor:pointer;
    background:linear-gradient(160deg,var(--bg-card-alt) 0%,var(--bg-card) 70%);
    border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;
    box-shadow:0 10px 30px rgba(3,10,20,0.5);transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .hero-game:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(3,10,20,0.6);}
  .hero-game::before{
    content:'';position:absolute;top:-50%;right:-15%;width:240px;height:240px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,122,122,0.18),transparent 70%);pointer-events:none;
  }
  .live-dot-wrap{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);position:relative;}
  .live-dot-wrap .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse-dot 1.6s infinite;}
  @keyframes pulse-dot{0%{box-shadow:0 0 0 0 rgba(255,122,122,0.55);}70%{box-shadow:0 0 0 9px rgba(255,122,122,0);}100%{box-shadow:0 0 0 0 rgba(255,122,122,0);}}
  .hero-game .hero-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;margin-top:8px;position:relative;line-height:1.05}
  .hero-game .hero-meta{color:var(--text-muted);font-size:14px;margin-top:3px;position:relative}
  .hero-game .hero-stats{display:flex;gap:10px;margin-top:16px;position:relative}
  .hero-game .hero-stat{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
  .hero-game .hero-stat .num{font-family:'Bebas Neue',sans-serif;font-size:21px;color:var(--gold-light);white-space:nowrap}
  .hero-game .hero-stat .lbl{font-size:9px;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.8px}
  .hero-game .hero-cta{margin-top:14px;position:relative}
  .pos{color:var(--green);}
  .neg{color:var(--red);}
  /* Participant row */
  .participant{
    display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);
  }
  .participant:last-child{border-bottom:none;}
  .p-name{display:flex;align-items:center;gap:8px;}
  .p-meta{font-size:12px;color:var(--text-muted);}
  /* Leaderboard */
  .lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);width:28px;}
  .lb-name{flex:1;font-weight:600;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty-state .icon{font-size:32px;margin-bottom:10px;}
  .footer-note{text-align:center;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);padding:20px;}
  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-box{background:var(--bg-card);border:1px solid var(--border);border-top:3px solid var(--gold);border-radius:var(--radius);max-width:420px;width:100%;padding:20px;max-height:85vh;overflow-y:auto;}
  .modal-box h3{font-size:24px;margin-bottom:6px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-card-alt);
    border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:8px;font-size:14px;z-index:200;
  }
  .link-btn{background:none;border:none;color:var(--gold-light);cursor:pointer;font-size:13px;text-decoration:underline;font-family:'Barlow Condensed',sans-serif;margin-top:14px;}
  /* Admin */
  .badge.purple{background:rgba(45,212,191,0.15);color:#2dd4bf;border:1px solid rgba(45,212,191,0.4);}
  .badge.blue{background:rgba(88,166,255,0.15);color:#58a6ff;border:1px solid rgba(88,166,255,0.4);}
  .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px;}
  .kpi-box{background:var(--bg-card-alt);border:1px solid var(--border);border-radius:8px;padding:14px;}
  .kpi-box .num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold-light);}
  .kpi-box .lbl{font-size:10px;text-transform:uppercase;color:var(--text-muted);letter-spacing:1px;margin-top:2px;}
  .admin-tag{font-size:9px;background:var(--gold);color:var(--on-accent);padding:2px 6px;border-radius:4px;font-weight:700;text-transform:uppercase;margin-left:6px;vertical-align:middle;}
  .list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .actions{display:flex;gap:6px;flex-shrink:0;}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .subtabs button{
    background:var(--bg-card-alt);border:1px solid var(--border);color:var(--text-muted);
    padding:7px 14px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;
    text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;
  }
  .subtabs button.active{background:rgba(62,166,255,0.15);color:var(--gold);border-color:var(--gold);}
  /* Landing */
  .landing-hero{
    padding:56px 20px 36px;text-align:center;position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 0%,rgba(62,166,255,0.20),transparent 60%),
               radial-gradient(circle at 10% 110%,rgba(45,212,160,0.14),transparent 55%);
  }
  .landing-hero .suit-mark{
    position:absolute;top:-40px;right:-20px;font-size:220px;line-height:1;
    color:rgba(62,166,255,0.07);pointer-events:none;user-select:none;font-family:Georgia,serif;transform:rotate(12deg);
  }
  .landing-hero .suit-mark.alt{
    left:-30px;right:auto;top:auto;bottom:-70px;color:rgba(45,212,160,0.06);transform:rotate(-18deg);font-size:180px;
  }
  .landing-hero .content{position:relative;z-index:1;}
  .landing-hero .wordmark{font-family:'Bebas Neue',sans-serif;font-size:50px;letter-spacing:4px;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .landing-hero .tagline{text-transform:uppercase;letter-spacing:3px;font-size:12px;color:var(--text-muted);margin-top:6px;}
  .landing-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px;position:relative;z-index:1;}
  .landing-stats .stat-pill{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;}
  .landing-stats .stat-pill b{color:var(--gold-light);font-family:'Bebas Neue',sans-serif;font-size:17px;margin-right:5px;letter-spacing:0.5px;}
  .landing-nav{display:flex;justify-content:flex-end;padding:16px 20px 0;}
  .landing-section{padding:0 20px 40px;max-width:820px;margin:0 auto;}
  .landing-empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
  /* Poster */
  .poster-outer{display:flex;justify-content:center;margin:6px 0 14px;}
  .poster-card{
    width:270px;aspect-ratio:9/16;border-radius:16px;overflow:hidden;position:relative;
    background:radial-gradient(circle at 30% 0%,rgba(62,166,255,0.35),transparent 55%),
               radial-gradient(circle at 80% 100%,rgba(45,212,160,0.30),transparent 55%),
               var(--bg);
    border:1px solid var(--border);
    display:flex;flex-direction:column;justify-content:space-between;padding:22px 18px;
  }
  .poster-card .p-eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:var(--gold-light);font-weight:700;}
  .poster-card .p-brand{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold);}
  .poster-card .p-name{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1.02;letter-spacing:1px;color:var(--text);margin-top:10px;}
  .poster-card .p-badges{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .poster-card .p-date{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold-light);margin-top:18px;}
  .poster-card .p-loc{font-size:14px;color:var(--text-muted);margin-top:2px;}
  .poster-card .p-buyin-box{
    margin-top:18px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;

    letter-spacing:1px;font-size:13px;padding:10px;border-radius:8px;

<body>
<div id="app"></div>
<script>
/* ---------- Storage helpers ---------- */
async function loadPlayers(){
  try{ const r = await window.storage.get('ltdv_players', true); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}
async function savePlayers(arr){
  try{ await window.storage.set('ltdv_players', JSON.stringify(arr), true); }catch(e){ console.error(e); }
}
async function loadGames(){
  try{ const r = await window.storage.get('ltdv_games', true); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}
async function saveGames(arr){
  try{ await window.storage.set('ltdv_games', JSON.stringify(arr), true); }catch(e){ console.error(e); }
}
async function loadStaff(){
  try{ const r = await window.storage.get('ltdv_staff', true); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}
async function saveStaff(arr){
  try{ await window.storage.set('ltdv_staff', JSON.stringify(arr), true); }catch(e){ console.error(e); }
}
async function loadCommunityChat(){
  try{ const r = await window.storage.get('ltdv_community_chat', true); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}
async function saveCommunityChat(arr){
  try{ await window.storage.set('ltdv_community_chat', JSON.stringify(arr), true); }catch(e){ console.error(e); }
}
async function loadDmMessages(){
  try{ const r = await window.storage.get('ltdv_dm_messages', true); return r ? JSON.parse(r.value) : []; }
  catch(e){ return []; }
}
async function saveDmMessages(arr){
  try{ await window.storage.set('ltdv_dm_messages', JSON.stringify(arr), true); }catch(e){ console.error(e); }
}
async function loadAppUrl(){
  try{ const r = await window.storage.get('ltdv_app_url', true); return r ? r.value : ''; }
  catch(e){ return ''; }
}
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const PAYMENT_METHODS = ['Espèces','Carte','Virement','PayPal','Crypto','Crédit Maison','Autre'];
function fmt(n){ return (Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function euro(n){ const s = fmt(n); return (n>0?'+':'')+s+' €'; }

/* ---------- State ---------- */
let state = {
  loading: true,
  players: [],
  games: [],
  staff: [],
  communityChat: [],
  dmMessages: [],
  appUrl: '',
  messagesTab: 'community',
  activeDmPlayerId: null,
  currentPlayer: null,
  view: 'dashboard',
  loginMode: 'select', // select | pin-existing | pin-new
  loginTarget: null,
  pinBuffer: '',
  gameFilter: 'upcoming',
  activeGameId: null,
  adminTab: 'overview',
  activePlayerAnalyticsId: null,
  playerSearchQuery: '',
  gameSearchQuery: '',
  gamesViewMode: 'list',
  calendarMonth: null,
  calendarSelectedDate: null,
  showLogin: false,
  pendingGameId: null,
  modal: null,
  toast: null
};

function toast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2200);
}

async function init(){
  state.players = await loadPlayers();
  state.games = await loadGames();
  state.staff = await loadStaff();
  state.communityChat = await loadCommunityChat();
  state.dmMessages = await loadDmMessages();
  state.appUrl = await loadAppUrl();
  // Migration : si aucun admin n'existe, le compte le plus ancien le devient
  if(state.players.length && !state.players.some(p=>p.isAdmin)){
    const sorted = [...state.players].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const firstId = sorted[0].id;
    state.players = state.players.map(p=>p.id===firstId ? {...p, isAdmin:true} : p);
    await savePlayers(state.players);
  }
  state.loading = false;
  render();
}
function canManage(g){
  return !!state.currentPlayer && (g.organizerId===state.currentPlayer.id || state.currentPlayer.isAdmin);
}

/* ---------- Auth actions ---------- */
function goToLogin(pendingGameId){
  state.showLogin = true;
  state.pendingGameId = pendingGameId || null;
  state.loginMode = 'select';
  render();
}
function backToLanding(){
  state.showLogin = false;
  state.pendingGameId = null;
  render();
}
function selectPlayerChip(id){
  state.loginTarget = id;
  state.loginMode = 'pin-existing';
  state.pinBuffer = '';
  render();
}
function startNewAccount(){
  state.loginMode = 'new-name';
  render();
}
function backToSelect(){
  state.loginMode = 'select';
  state.loginTarget = null;
  state.pinBuffer = '';
  render();
}
function submitNewName(){
  const val = document.getElementById('new-pseudo-input').value.trim();
  if(!val){ toast('Entre un pseudo'); return; }
  if(state.players.some(p=>p.pseudo.toLowerCase()===val.toLowerCase())){
    toast('Ce pseudo existe déjà'); return;
  }
  state.loginTarget = { pseudo: val };
  state.loginMode = 'pin-new';
  state.pinBuffer = '';
  render();
}
async function keypadPress(digit){
  if(state.pinBuffer.length>=4) return;
  state.pinBuffer += digit;
  render();
  if(state.pinBuffer.length===4){
    await handlePinComplete();
  }
}
function keypadClear(){
  state.pinBuffer = state.pinBuffer.slice(0,-1);
  render();
}

/* ---------- Non-lus & notifications ---------- */
let notifState = { enabled:false, lastCommunity:0, lastDm:0, lastPending:0, intervalId:null };

function unreadCommunityCount(){
  if(!state.currentPlayer) return 0;
  const seen = state.currentPlayer.lastSeenCommunityAt || 0;
  return state.communityChat.filter(m=>m.at>seen && m.playerId!==state.currentPlayer.id).length;
}
function unreadDmCount(){
  if(!state.currentPlayer) return 0;
  const seen = state.currentPlayer.lastSeenDmAt || 0;
  if(state.currentPlayer.isAdmin){
    return state.dmMessages.filter(m=>m.at>seen && !m.fromAdmin).length;
  }
  return state.dmMessages.filter(m=>m.playerId===state.currentPlayer.id && m.at>seen && m.fromAdmin).length;
}
function pendingRequestsCount(){
  if(!state.currentPlayer || !state.currentPlayer.isAdmin) return 0;
  let count = 0;
  state.games.filter(g=>g.status==='live').forEach(g=>{
    g.participants.forEach(p=>{ count += (p.requests||[]).filter(r=>r.status==='pending').length; });
  });
  return count;
}
function markCommunitySeenSync(){
  if(!state.currentPlayer) return;
  state.currentPlayer.lastSeenCommunityAt = Date.now();
  const idx = state.players.findIndex(p=>p.id===state.currentPlayer.id);
  if(idx>=0) state.players[idx] = state.currentPlayer;
  savePlayers(state.players);
}
function markDmSeenSync(){
  if(!state.currentPlayer) return;
  state.currentPlayer.lastSeenDmAt = Date.now();
  const idx = state.players.findIndex(p=>p.id===state.currentPlayer.id);
  if(idx>=0) state.players[idx] = state.currentPlayer;
  savePlayers(state.players);
}
async function toggleNotifications(){
  if(typeof Notification==='undefined'){ toast('Notifications non supportées ici'); return; }
  try{
    if(Notification.permission==='granted'){
      notifState.enabled = !notifState.enabled;
      if(notifState.enabled) startNotificationPolling(); else stopNotificationPolling();
      toast(notifState.enabled ? 'Notifications activées' : 'Notifications désactivées');
      render();
      return;
    }
    const perm = await Notification.requestPermission();
    if(perm==='granted'){ notifState.enabled = true; startNotificationPolling(); toast('Notifications activées'); }
    else { toast('Autorisation refusée par le navigateur'); }
  }catch(e){
    toast('Notifications indisponibles dans ce contexte');
  }
  render();
}
function startNotificationPolling(){
  if(notifState.intervalId) return;
  notifState.lastCommunity = unreadCommunityCount();
  notifState.lastDm = unreadDmCount();
  notifState.lastPending = pendingRequestsCount();
  notifState.intervalId = setInterval(checkForNewNotifications, 15000);
}
function stopNotificationPolling(){
  if(notifState.intervalId){ clearInterval(notifState.intervalId); notifState.intervalId = null; }
  notifState.enabled = false;
}
async function checkForNewNotifications(){
  if(!state.currentPlayer || !notifState.enabled) return;
  state.games = await loadGames();
  state.communityChat = await loadCommunityChat();
  state.dmMessages = await loadDmMessages();
  const c = unreadCommunityCount(), d = unreadDmCount(), p = pendingRequestsCount();
  if(c>notifState.lastCommunity) fireBrowserNotification('Poker Live — Communauté', 'Nouveau message dans le chat communauté');
  if(d>notifState.lastDm) fireBrowserNotification('Poker Live — Message', 'Tu as reçu un nouveau message privé');
  if(p>notifState.lastPending) fireBrowserNotification('Poker Live — Demande', 'Une demande de recave attend ta validation');
  notifState.lastCommunity = c; notifState.lastDm = d; notifState.lastPending = p;
  render();
}
function fireBrowserNotification(title, body){
  try{ new Notification(title, { body }); }catch(e){ console.error('notif error', e); }
}

function shiftCalendarMonth(delta){
  const monthStr = state.calendarMonth || new Date().toISOString().slice(0,7);
  const [y,m] = monthStr.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  state.calendarMonth = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  render();
}
function openGame(id){
  // unsubscribe previous
  try{ if(window.pokerSync && window.pokerSync.unsubscribeFromGame && window._currentGameSub) { window.pokerSync.unsubscribeFromGame(window._currentGameSub); window._currentGameSub = null; } }catch(e){console.error(e);} 
  state.activeGameId = id; state.view = 'game-detail'; render();
  // subscribe to realtime updates for this game (if available)
  try{
    if(window.pokerSync && window.pokerSync.subscribeToGame){
      window._currentGameSub = window.pokerSync.subscribeToGame(id, (payload)=>{
        try{ // payload may contain new record
          if(payload && payload.new){
            // find and replace game in state.games
            const updated = payload.new;
            state.games = state.games.map(g=>g.id===updated.id? updated : g);
            render();
          }
        }catch(e){console.error('realtime handler',e);}      
      });
    }
  }catch(e){console.error('subscribe failed',e);} 
}

  const toAdd = state.players.filter(pl=>!game.participants.some(p=>p.playerId===pl.id)).slice(0, remainingSlots);

    const participant = { playerId: pl.id, pseudo: pl.pseudo, paymentMethod: method, buyIns: [], requests: [], cashOut: null, joinedAt: Date.now() };

  const missing = game.participants.some(p=>p.cashOut===null);
  if(missing){ toast('Renseigne tous les cash-outs avant de clôturer'); return; }
  game.participants.forEach(p=>{
    const totalBuyIn = p.buyIns.reduce((a,b)=>a+b.amount,0);
    p.net = p.cashOut - totalBuyIn;
    p.totalBuyIn = totalBuyIn;
  });
  game.status = 'completed';
  game.endedAt = game.endedAt || Date.now();
  await saveGames(state.games);
  const unsetSalaries = (game.staffAssignments||[]).filter(a=>a.salary===null || a.salary===undefined).length;
  toast(unsetSalaries>0 ? `Partie clôturée — pense à définir le salaire de ${unsetSalaries} membre(s) du staff` : 'Partie clôturée');
  render();
}

function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);

  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function monthlySummary(){
  const now = new Date();
  const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const monthGames = state.games.filter(g=>g.status==='completed' && (g.date||'').startsWith(ym));
  let rake=0, houseNet=0; const playerNet={};
  let bestSession=null;
  monthGames.forEach(g=>{
    const f = gameFinancials(g);
    rake += f.rakeTotal; houseNet += f.houseNet;
    g.participants.forEach(p=>{
      if(p.net===undefined) return;
      playerNet[p.pseudo] = (playerNet[p.pseudo]||0) + p.net;
      if(bestSession===null || p.net>bestSession.net) bestSession = { pseudo:p.pseudo, net:p.net, game:g.name };
    });
  });
  const top = Object.entries(playerNet).sort((a,b)=>b[1]-a[1])[0];
  return { sessions: monthGames.length, rake, houseNet, topPlayer: top ? {pseudo:top[0], net:top[1]} : null, bestSession };
}

function playerAnalytics(playerId){
  const completed = state.games.filter(g=>g.status==='completed').sort((a,b)=>(a.date||'').localeCompare(b.date||'') || a.createdAt-b.createdAt);
  let cumulative = 0;
  const timeline = [];
  let totalHours = 0, totalNet = 0, totalBuyIn = 0, wins = 0, sessions = 0, best = null, worst = null;
  const variantCount = {};
  const methodCount = {};
  completed.forEach(g=>{
    const p = g.participants.find(pp=>pp.playerId===playerId);
    if(!p || p.net===undefined) return;
    sessions++;
    totalNet += p.net;
    totalBuyIn += p.totalBuyIn;
    if(p.net>0) wins++;
    if(best===null || p.net>best) best = p.net;
    if(worst===null || p.net<worst) worst = p.net;
    variantCount[g.variant||'NLH'] = (variantCount[g.variant||'NLH']||0)+1;
    p.buyIns.forEach(b=>{ methodCount[b.method] = (methodCount[b.method]||0)+1; });
    const from = Math.max(p.joinedAt||0, g.startedAt||p.joinedAt||0);
    const to = g.endedAt || p.cashOutAt || from;
    const hours = Math.max((to-from)/3600000, 0);
    totalHours += hours;
    cumulative += p.net;
    timeline.push({ date: g.date || '', label: g.name, net: p.net, cumulative });
  });
  return {
    sessions, totalNet, totalBuyIn, wins,
    winRate: sessions ? (wins/sessions*100) : 0,
    roi: totalBuyIn>0 ? (totalNet/totalBuyIn*100) : 0,
    best, worst,
    totalHours, perHour: totalHours>0 ? (totalNet/totalHours) : 0,
    avgBuyIn: sessions ? (totalBuyIn/sessions) : 0,
    variantCount, methodCount, timeline
  };
}

function gameFinancials(g){
  const rakeTotal = (g.rakeEntries||[]).reduce((a,e)=>a+e.amount,0);
  const staffCost = (g.staffAssignments||[]).reduce((a,s)=>a+s.cost,0);
  const expensesTotal = (g.expenses||[]).reduce((a,e)=>a+e.amount,0);
  const tipsTotal = (g.tipEntries||[]).reduce((a,e)=>a+e.amount,0);
  const tipsByRole = {};
  (g.tipEntries||[]).forEach(e=>{ tipsByRole[e.role] = (tipsByRole[e.role]||0) + e.amount; });
  const potTotal = g.participants.reduce((a,p)=>a+p.buyIns.reduce((x,y)=>x+y.amount,0),0);
  const cashOutTotal = g.participants.reduce((a,p)=>a+(p.cashOut||0),0);
  const paymentBreakdown = {};
  g.participants.forEach(p=>p.buyIns.forEach(b=>{
    paymentBreakdown[b.method] = (paymentBreakdown[b.method]||0) + b.amount;
  }));
  const startedAt = g.startedAt;
  const endedAt = g.endedAt || (g.status==='live' ? Date.now() : null);
  const durationHours = (startedAt && endedAt) ? Math.max((endedAt-startedAt)/3600000, 1/60) : null;
  const rakePerHour = (durationHours && rakeTotal>0) ? rakeTotal/durationHours : null;
  const houseNet = rakeTotal - staffCost - expensesTotal;
  return { rakeTotal, staffCost, expensesTotal, tipsTotal, tipsByRole, potTotal, cashOutTotal, paymentBreakdown, durationHours, rakePerHour, houseNet };
}
function adminGlobalStats(){
  let totalRake=0, totalStaffCost=0, totalExpenses=0, totalPot=0;
  const rakeHourSamples=[];
  const counts = { upcoming:0, live:0, completed:0 };
  state.games.forEach(g=>{
    counts[g.status] = (counts[g.status]||0)+1;
    const f = gameFinancials(g);
    totalRake += f.rakeTotal; totalStaffCost += f.staffCost; totalExpenses += f.expensesTotal; totalPot += f.potTotal;
    if(f.rakePerHour!==null) rakeHourSamples.push(f.rakePerHour);
  });
  const avgRakeHour = rakeHourSamples.length ? rakeHourSamples.reduce((a,b)=>a+b,0)/rakeHourSamples.length : 0;
  return {
    totalRake, totalStaffCost, totalExpenses, totalPot,
    houseNet: totalRake - totalStaffCost - totalExpenses,
    avgRakeHour, counts,
    totalGames: state.games.length, totalPlayers: state.players.length, totalStaff: state.staff.length
  };
}

function leaderboardData(){
  const map = {};
  state.games.filter(g=>g.status==='completed').forEach(g=>{
    g.participants.forEach(p=>{
      if(p.net===undefined) return;
      if(!map[p.playerId]) map[p.playerId] = { playerId:p.playerId, pseudo:p.pseudo, net:0, sessions:0, totalBuyIn:0, wins:0 };
      map[p.playerId].net += p.net;
      map[p.playerId].sessions += 1;
      map[p.playerId].totalBuyIn += p.totalBuyIn;
      if(p.net>0) map[p.playerId].wins += 1;
    });
  });
  return Object.values(map).sort((a,b)=>b.net-a.net);
}

  if(state.loading){ app.innerHTML = '<div class="login-wrap"><span class="muted">Chargement…</span></div>'; return; }

}

function renderGamesCalendar(){
  const monthStr = state.calendarMonth || new Date().toISOString().slice(0,7);
  const [y,m] = monthStr.split('-').map(Number);
  const firstOfMonth = new Date(y, m-1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  let startWeekday = firstOfMonth.getDay(); // 0=Sun
  startWeekday = (startWeekday+6)%7; // convert to Monday-first (0=Mon)
  const monthLabel = firstOfMonth.toLocaleDateString('fr-FR',{month:'long', year:'numeric'});
  const gamesByDay = {};
  state.games.forEach(g=>{ if(g.date) { (gamesByDay[g.date] = gamesByDay[g.date]||[]).push(g); } });
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayGames = gamesByDay[dateStr] || [];
    const dots = dayGames.slice(0,3).map(g=>`<span style="display:inline-block;width:6px;height:6px;border-radius:50%;margin:1px;background:${g.status==='live'?'var(--red)':g.status==='completed'?'var(--text-muted)':'var(--gold)'}"></span>`).join('');
    cells += `<div data-calendar-day="${dateStr}" style="cursor:pointer;border:1px solid var(--border);border-radius:6px;padding:6px 4px;min-height:44px;background:${state.calendarSelectedDate===dateStr?'var(--bg-card-alt)':'transparent'}">
      <div style="font-size:12px;color:var(--text-muted)">${d}</div>
      <div>${dots}</div>
    </div>`;
  }
  const weekdays = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const selectedGames = state.calendarSelectedDate ? (gamesByDay[state.calendarSelectedDate]||[]) : [];
  return `
    <div class="card flat">
      <div class="row" style="margin-bottom:10px">
        <button class="btn small secondary" id="btn-cal-prev">←</button>
        <div class="eyebrow" style="text-transform:capitalize">${monthLabel}</div>
        <button class="btn small secondary" id="btn-cal-next">→</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">
        ${weekdays.map(w=>`<div style="text-align:center;font-size:10px;color:var(--text-muted);text-transform:uppercase">${w}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
    </div>
    ${state.calendarSelectedDate ? `
      <div class="eyebrow" style="margin:14px 0 8px">Parties du ${state.calendarSelectedDate}</div>
      ${selectedGames.length ? selectedGames.map(renderGameCard).join('') : `<div class="muted">Aucune partie ce jour-là.</div>`}
    ` : ''}
  `;
}

          <div class="participant">
            <div><span class="p-name">${escapeHtml(p.pseudo)}</span><div class="p-meta">💳 ${escapeHtml(p.paymentMethod||'Espèces')}</div></div>

}

function renderAdminDm(){
  const isAdmin = !!state.currentPlayer.isAdmin;
  if(isAdmin && !state.activeDmPlayerId){
    const threadIds = [...new Set(state.dmMessages.map(m=>m.playerId))];
    const threads = threadIds.map(pid=>{
      const msgs = state.dmMessages.filter(m=>m.playerId===pid).sort((a,b)=>b.at-a.at);
      const player = state.players.find(p=>p.id===pid);
      return { pid, pseudo: player ? player.pseudo : 'Joueur supprimé', last: msgs[0], count: msgs.length };
    }).sort((a,b)=>b.last.at-a.last.at);
    return `
      <div class="card flat">
        <div class="eyebrow">Conversations (${threads.length})</div>
        ${threads.length ? threads.map(t=>`
          <div class="list-row" data-open-dm-thread="${t.pid}" style="cursor:pointer">
            <div><span class="p-name">${escapeHtml(t.pseudo)}</span><div class="p-meta">${escapeHtml((t.last.text||'').slice(0,60))}</div></div>
            <span class="muted">${new Date(t.last.at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</span>
          </div>
        `).join('') : "<div class=\"muted\">Aucun joueur ne t'a encore écrit.</div>"}
      </div>
    `;
  }
  const threadPlayerId = isAdmin ? state.activeDmPlayerId : state.currentPlayer.id;
  const threadPlayer = state.players.find(p=>p.id===threadPlayerId);
  const messages = state.dmMessages.filter(m=>m.playerId===threadPlayerId).sort((a,b)=>a.at-b.at);
  return `
    ${isAdmin ? `<button class="link-btn" id="btn-back-dm-list" style="margin-bottom:10px">← Toutes les conversations</button>
    <div class="eyebrow" style="margin-bottom:8px">Conversation avec ${escapeHtml(threadPlayer ? threadPlayer.pseudo : '')}</div>` : `<p class="muted" style="margin-bottom:10px">Discute en privé avec l'équipe d'administration.</p>`}
    <div class="card flat" style="max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:10px">
      ${messages.length ? messages.map(m=>`
        <div>
          <div class="p-meta"><span class="p-name" style="font-size:13px">${escapeHtml(m.senderPseudo)}${m.fromAdmin?'<span class="admin-tag">Admin</span>':''}</span> · ${new Date(m.at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
          <div>${escapeHtml(m.text)}</div>
        </div>
      `).join('') : "<div class=\"muted\">Aucun message. Pose ta question à l'équipe.</div>"}
    </div>
    <div class="field-row" style="margin-top:12px">
      <div><input id="dm-input" placeholder="Ton message…"></div>
      <div style="flex:0 0 auto"><button class="btn" id="btn-send-dm">Envoyer</button></div>
    </div>
  `;
}

function renderPlayerAnalyticsBlock(playerId, canvasId, backLink){
  const player = state.players.find(p=>p.id===playerId);
  const pa = playerAnalytics(playerId);
  const myGames = state.games.filter(g=>g.participants.some(p=>p.playerId===playerId)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const topMethod = Object.entries(pa.methodCount).sort((a,b)=>b[1]-a[1])[0];
  const topVariant = Object.entries(pa.variantCount).sort((a,b)=>b[1]-a[1])[0];
  return `
    ${backLink || ''}
    <h2 class="card-title" style="margin-bottom:14px">${player ? escapeHtml(player.pseudo) : 'Profil'}</h2>
    ${player && (player.clubggUsername || (player.pokerAccounts||[]).length) ? `
      <div class="muted" style="margin-bottom:10px">
        ${player.clubggUsername ? `💻 ClubGG : ${escapeHtml(player.clubggUsername)}` : ''}
        ${(player.pokerAccounts||[]).length ? (player.clubggUsername?' · ':'') + player.pokerAccounts.map(a=>`🃏 ${escapeHtml(a.site)}: ${escapeHtml(a.username)}`).join(' · ') : ''}
      </div>
    ` : ''}
    <div class="card flat">
      <div class="stat-grid">
        <div class="stat-box"><div class="num ${pa.totalNet>=0?'pos':'neg'}">${euro(pa.totalNet)}</div><div class="lbl">Bilan total</div></div>
        <div class="stat-box"><div class="num">${pa.sessions}</div><div class="lbl">Sessions</div></div>
        <div class="stat-box"><div class="num">${fmt(pa.winRate)}%</div><div class="lbl">Taux de victoire</div></div>
      </div>
      <div class="kpi-grid" style="margin-top:10px">
        <div class="kpi-box"><div class="num">${fmt(pa.totalHours)} h</div><div class="lbl">Heures jouées</div></div>
        <div class="kpi-box"><div class="num ${pa.perHour>=0?'pos':'neg'}">${euro(pa.perHour)}</div><div class="lbl">€ / heure</div></div>
        <div class="kpi-box"><div class="num">${fmt(pa.avgBuyIn)} €</div><div class="lbl">Buy-in moyen</div></div>
        <div class="kpi-box"><div class="num">${pa.roi>=0?'+':''}${fmt(pa.roi)}%</div><div class="lbl">ROI</div></div>
        <div class="kpi-box"><div class="num pos">${pa.best!==null?euro(pa.best):'—'}</div><div class="lbl">Meilleure session</div></div>
        <div class="kpi-box"><div class="num neg">${pa.worst!==null?euro(pa.worst):'—'}</div><div class="lbl">Pire session</div></div>
      </div>
      ${topMethod || topVariant ? `<div class="muted" style="margin-top:10px">${topVariant?`Format favori : ${escapeHtml(topVariant[0])} (${topVariant[1]} session(s))`:''}${topMethod?` · Paiement le plus utilisé : ${escapeHtml(topMethod[0])}`:''}</div>` : ''}
    </div>
    ${pa.timeline.length>1 ? `
      <div class="card flat">
        <div class="eyebrow" style="margin-bottom:10px">Évolution du bilan cumulé</div>
        <div style="height:220px"><canvas id="${canvasId}"></canvas></div>
      </div>
    ` : ''}
    <div class="eyebrow" style="margin:14px 0 8px">Historique</div>
    ${myGames.length ? myGames.map(g=>{
      const p = g.participants.find(pp=>pp.playerId===playerId);
      const net = p && p.net!==undefined ? euro(p.net) : g.status==='completed' ? '—' : (g.status==='live'?'En cours':'À venir');
      const netClass = p && p.net!==undefined ? (p.net>=0?'pos':'neg') : '';
      return `<div class="card flat" data-open-game="${g.id}" style="cursor:pointer">
        <div class="row">
          <div><strong>${escapeHtml(g.name)}</strong><div class="muted">${g.date||''}</div></div>
          <span class="${netClass}" style="font-family:'Bebas Neue',sans-serif;font-size:18px">${net}</span>
        </div>
      </div>`;
    }).join('') : `<div class="empty-state">Aucune partie rejointe pour l'instant.</div>`}
  `;
}

            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);margin:0"><input type="checkbox" id="cg-amenity-masseuse" style="width:auto">💆 Masseuse</label>

            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-buyin">Valider</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='request-buyin'){
    const rGame = state.games.find(g=>g.id===state.modal.gameId);
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Demander une recave</h3>
          <p class="muted">Ta demande sera envoyée à l'admin avec l'heure exacte, en attente de validation.</p>
          <label>Montant (€)</label>
          <input id="req-buyin-amount" type="number" min="0" value="${rGame.buyIn}" autofocus>
          <label>Moyen de paiement</label>
          <select id="req-buyin-method">
            ${PAYMENT_METHODS.map(m=>`<option value="${m}" ${(state.currentPlayer.paymentMethod||'Espèces')===m?'selected':''}>${m}</option>`).join('')}
          </select>
          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-request-buyin">Envoyer la demande</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='edit-buyin'){
    const eGame = state.games.find(g=>g.id===state.modal.gameId);
    const eP = eGame.participants.find(p=>p.playerId===state.modal.playerId);
    const eBuyin = eP.buyIns[state.modal.index];
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
          <h3>Modifier la recave</h3>
          <p class="muted">Corrige le montant ou le moyen de paiement de cette recave.</p>
          <label>Montant (€)</label>
          <input id="edit-buyin-amount" type="number" min="0" value="${eBuyin.amount}" autofocus>
          <label>Moyen de paiement</label>
          <select id="edit-buyin-method">
            ${PAYMENT_METHODS.map(m=>`<option value="${m}" ${eBuyin.method===m?'selected':''}>${m}</option>`).join('')}

          <div class="modal-actions">
            <button class="btn secondary" id="modal-cancel">Annuler</button>
            <button class="btn" id="modal-confirm-edit-buyin">Enregistrer</button>
          </div>
        </div>
      </div>
    `;
  }
  if(state.modal.type==='edit-arrival'){
    const eGame = state.games.find(g=>g.id===state.modal.gameId);
    const eP = eGame.participants.find(p=>p.playerId===state.modal.playerId);
    const current = eP.joinedAt ? new Date(eP.joinedAt) : (eGame.startedAt ? new Date(eGame.startedAt) : new Date());
    const pad = n=>String(n).padStart(2,'0');
    const dateVal = `${current.getFullYear()}-${pad(current.getMonth()+1)}-${pad(current.getDate())}`;
    const timeVal = `${pad(current.getHours())}:${pad(current.getMinutes())}`;
    return `

        </div>
      </div>
